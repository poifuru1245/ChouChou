  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/design-system-v11.css?v=11.3.0">
  <link rel="stylesheet" href="assets/css/interior-v14.css?v=14.0.0">
</head>
<body class="interior-page premium-design-system">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Chou Chou<small>シュシュ</small></a>
      <nav class="nav" aria-label="メインナビゲーション">
        <a href="index.html">HOME</a><a href="cast.html">CAST</a><a href="schedule.html">SCHEDULE</a><a href="system.html">SYSTEM</a><a href="gallery.html" aria-current="page">GALLERY</a><a href="access.html">ACCESS</a><a href="recruit.html">RECRUIT</a><a href="contact.html">CONTACT</a>
      </nav>
      <a href="reservation.html" class="button-premium header-cta">WEB予約</a>
    </div>
  </header>

  <main class="gallery-page">
    <section class="gallery public-gallery-section">
      <div class="section-title"><span>Gallery</span><h1>店内ギャラリー</h1></div>
      <div class="public-gallery-grid" id="publicGalleryGrid"><p class="gallery-empty">読み込み中...</p></div>
    </section>
  </main>

  <div class="gallery-lightbox" id="galleryLightbox" role="dialog" aria-modal="true" aria-label="ギャラリー画像" aria-hidden="true">
    <button type="button" class="gallery-lightbox-close" id="galleryLightboxClose" aria-label="閉じる">×</button>
    <button type="button" class="gallery-lightbox-backdrop" id="galleryLightboxBackdrop" aria-label="閉じる"></button>
    <div class="gallery-lightbox-content">
      <button type="button" class="gallery-lightbox-nav gallery-lightbox-prev" id="galleryLightboxPrev" aria-label="前の画像">‹</button>
      <img id="galleryLightboxImage" src="" alt="">
      <button type="button" class="gallery-lightbox-nav gallery-lightbox-next" id="galleryLightboxNext" aria-label="次の画像">›</button>
      <p id="galleryLightboxTitle"></p>
    </div>
  </div>

  <script type="module" src="assets/app.js?v=1.0.0"></script>
  <script type="module" src="assets/gallery.js?v=7.5.0"></script>

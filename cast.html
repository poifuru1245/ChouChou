<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast | Chou Chou</title>
  <meta name="description" content="すすきの Chou Chouのキャスト一覧">
  <link rel="stylesheet" href="assets/css/style.css?v=6.0.2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/design-system-v11.css?v=11.3.0">
  <link rel="stylesheet" href="assets/css/interior-v14.css?v=6.0.1">
</head>
<body class="interior-page premium-design-system">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Chou Chou<small>シュシュ</small></a>
      <nav class="nav" aria-label="メインナビゲーション">
        <a href="index.html">HOME</a><a href="cast.html" aria-current="page">CAST</a><a href="schedule.html">SCHEDULE</a><a href="system.html">SYSTEM</a><a href="gallery.html">GALLERY</a><a href="access.html">ACCESS</a><a href="recruit.html">RECRUIT</a><a href="contact.html">CONTACT</a>
      </nav>
      <a href="reservation.html" class="button-premium header-cta">WEB予約</a>
    </div>
  </header>

  <main class="interior-main">
    <header class="interior-hero">
      <div class="section-title"><span>Cast</span><h1>キャスト一覧</h1></div>
      <p>Chou Chouでお迎えするキャストをご紹介します。写真を選択すると詳しいプロフィールをご覧いただけます。</p>
    </header>
    <section class="v6-cast-search glass-panel" aria-labelledby="castSearchTitle">
      <div class="v6-search-heading"><div><span>Cast Search</span><h2 id="castSearchTitle">キャスト検索</h2></div><a href="favorites.html" class="button-premium v6-favorites-link">♡ お気に入り <b data-favorite-count>0</b></a></div>
      <form class="v6-search-form" data-cast-search>
        <label><span>名前</span><input name="name" type="search" placeholder="名前で検索"></label>
        <label><span>年齢</span><input name="age" type="number" min="18" max="99" inputmode="numeric" placeholder="例 24"></label>
        <label><span>身長</span><input name="height" type="number" min="130" max="200" inputmode="numeric" placeholder="例 162"></label>
        <label><span>血液型</span><select name="bloodType"><option value="">すべて</option><option value="A">A型</option><option value="B">B型</option><option value="O">O型</option><option value="AB">AB型</option></select></label>
        <label><span>趣味</span><input name="hobby" type="search" placeholder="趣味で検索"></label>
        <fieldset><legend>絞り込み</legend><label><input name="recommended" type="checkbox">おすすめ</label><label><input name="new" type="checkbox">NEW</label><label><input name="today" type="checkbox">本日出勤</label></fieldset>
        <button type="reset" class="button-premium v6-search-reset">条件をクリア</button>
      </form>
      <p class="v6-search-result">表示中 <strong id="castSearchCount">0名</strong></p>
    </section>
    <section class="interior-panel" aria-label="キャスト一覧">
      <div class="all-cast-grid interior-cast-grid">
        <p class="no-cast">読み込み中...</p>
      </div>
      <p id="castSearchEmpty" class="no-cast" hidden>条件に合うキャストが見つかりませんでした。</p>
    </section>
  </main>

  <script type="module" src="assets/app.js?v=6.0.0"></script>
  <script type="module" src="assets/cast.js?v=6.0.2"></script>
  <script src="assets/design-system-v11.js?v=11.3.0"></script>
</body>
</html>

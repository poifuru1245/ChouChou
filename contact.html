<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Chou Chouへのご予約・お問い合わせ"><title>Contact | Chou Chou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css?v=7.5.0"><link rel="stylesheet" href="assets/css/design-system-v11.css?v=11.3.0"><link rel="stylesheet" href="assets/css/interior-v14.css?v=14.0.0">
</head>
<body class="interior-page premium-design-system">
  <header class="header"><div class="header-inner"><a href="index.html" class="logo">Chou Chou<small>すすきのガールズバー</small></a><nav class="nav" aria-label="メインナビゲーション"><a href="cast.html">CAST</a><a href="schedule.html">SCHEDULE</a><a href="system.html">SYSTEM</a><a href="gallery.html">GALLERY</a><a href="access.html">ACCESS</a><a href="recruit.html">RECRUIT</a></nav><a href="reservation.html" class="button-premium header-cta" data-site-link="webReservationUrl">WEB予約</a></div></header>
  <main class="recruit-form-page contact-form-page">
    <header class="interior-hero"><div class="section-title"><span>Contact</span><h1>お問い合わせ</h1></div><p>ご予約・ご質問は、ご都合のよい方法からお気軽にお問い合わせください。</p></header>
    <section class="contact-channels" aria-label="お問い合わせ方法">
      <a href="#" class="contact-channel card-premium" data-site-link="lineReservationUrl"><span>LINE</span><strong>LINEで予約・問い合わせ</strong></a>
      <a href="tel:0110000000" class="contact-channel card-premium" data-site-phone="phoneNumber"><span>Phone</span><strong data-site-phone-text>011-XXX-XXXX</strong></a>
      <a href="#contactForm" class="contact-channel card-premium"><span>Email</span><strong>メールフォーム<br>24時間受付</strong></a>
    </section>
    <section class="recruit-form-card contact-form-card glass-panel">
      <div class="section-title"><span>Mail Form</span><h2>メールでのお問い合わせ</h2></div>
      <p class="recruit-form-lead">ご意見・ご質問などがございましたら、下記フォームよりお送りください。</p>
      <form id="contactForm" class="recruit-form contact-form">
        <label><span>お名前</span><input type="text" name="name" required autocomplete="name"></label>
        <label><span>メールアドレス</span><input type="email" name="email" required autocomplete="email"></label>
        <label><span>電話番号</span><input type="tel" name="phone" autocomplete="tel"></label>
        <label><span>お問い合わせ種別</span><select name="type" required><option value="">選択してください</option><option value="ご意見">ご意見</option><option value="ご質問">ご質問</option><option value="予約について">予約について</option><option value="その他">その他</option></select></label>
        <label class="recruit-form-wide"><span>ご意見・ご質問内容</span><textarea name="message" rows="7" required></textarea></label>
        <div class="recruit-form-actions"><button type="submit" class="button-premium button-primary">送信する</button><p id="contactFormStatus" class="recruit-form-status" aria-live="polite"></p></div>
      </form>
    </section>
  </main>
  <script type="module" src="assets/app.js?v=7.5.0"></script><script type="module" src="assets/contact-form.js?v=7.5.0"></script><script src="assets/design-system-v11.js?v=11.3.0" defer></script>
</body>
</html>

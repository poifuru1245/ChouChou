<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast Profile | Chou Chou</title>
  <meta id="castMetaDescription" name="description" content="Chou Chou キャストプロフィール">
  <meta id="castOgTitle" property="og:title" content="Cast Profile | Chou Chou">
  <meta id="castOgDescription" property="og:description" content="Chou Chou キャストプロフィール">
  <meta property="og:type" content="profile">
  <link rel="stylesheet" href="assets/css/style.css?v=7.0.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/design-system-v11.css?v=11.3.0">
  <link rel="stylesheet" href="assets/css/interior-v14.css?v=14.0.0">
  <link rel="stylesheet" href="assets/css/cast-detail-premium-v56.css?v=5.7.0">
</head>
<body class="interior-page cast-detail-page premium-design-system">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Chou Chou<small>シュシュ</small></a>
      <nav class="nav" aria-label="メインナビゲーション">
        <a href="index.html">HOME</a><a href="cast.html" aria-current="page">CAST</a><a href="schedule.html">SCHEDULE</a><a href="system.html">SYSTEM</a><a href="gallery.html">GALLERY</a><a href="access.html">ACCESS</a><a href="recruit.html">RECRUIT</a><a href="contact.html">CONTACT</a>
      </nav>
      <a href="reservation.html" class="button-premium header-cta">WEB予約</a>
    </div>
  </header>

  <main class="cast-detail cast-detail-premium" aria-live="polite">
    <section class="cast-gallery card-premium" aria-label="キャスト写真スライダー">
      <div id="castSliderStage" class="cast-slider-stage" tabindex="0">
        <img id="castImage" class="cast-main-image" alt="">
        <button id="castSlidePrev" class="cast-slide-arrow cast-slide-prev" type="button" aria-label="前の写真">‹</button>
        <button id="castSlideNext" class="cast-slide-arrow cast-slide-next" type="button" aria-label="次の写真">›</button>
        <span id="castSlideCounter" class="cast-slide-counter" aria-hidden="true"></span>
      </div>
      <div id="castThumbnails" class="cast-thumbnails" aria-label="写真を選択"></div>
    </section>

    <section class="profile-box card-premium">
      <div class="section-title cast-profile-title"><span class="profile-label">Cast Profile</span><h1 id="castName">Cast</h1></div>
      <dl id="castProfileGrid" class="profile-grid"></dl>
      <div id="castMessagePanel" class="profile-message" hidden>
        <span>MESSAGE</span>
        <p id="castMessage"></p>
      </div>
      <div id="castTags" class="cast-tags"></div>
      <div id="castSns" class="cast-sns" aria-label="SNS"></div>
      <p class="v6-cast-view-count" aria-live="polite"><span>閲覧数</span><strong id="castViewCount">--</strong></p>

      <section class="cast-weekly-schedule glass-panel" aria-labelledby="castScheduleTitle">
        <div class="cast-schedule-heading">
          <span>Weekly Schedule</span>
          <h2 id="castScheduleTitle">今週の出勤</h2>
        </div>
        <div id="castWeeklySchedule" class="cast-weekly-list">
          <p class="cast-schedule-loading">出勤予定を確認中です...</p>
        </div>
      </section>

      <div class="cast-detail-actions">
        <button type="button" id="castFavoriteButton" class="button-premium favorite-toggle" aria-pressed="false">♡ お気に入りに登録</button>
      </div>
    </section>
  </main>

  <nav class="cast-fixed-reservation" aria-label="予約メニュー">
    <a href="#" class="button-premium button-primary cast-fixed-line" data-site-link="lineReservationUrl" target="_blank" rel="noopener">LINE予約</a>
    <a href="reservation.html" class="button-premium cast-fixed-web">WEB予約</a>
    <a href="tel:011-000-0000" class="button-premium cast-fixed-phone" data-site-phone="phoneNumber">電話する</a>
  </nav>

  <script type="module" src="assets/app.js?v=7.0.0"></script>
  <script type="module" src="assets/cast-detail.js?v=7.0.0"></script>
  <script src="assets/design-system-v11.js?v=11.3.0"></script>
</body>
</html>

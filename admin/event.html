<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>イベント管理 | Chou Chou</title>
  <link rel="stylesheet" href="../assets/css/admin.css?v=8.0.0">
</head>
<body class="admin-premium">
  <div class="admin-layout">
    <aside class="sidebar"><h2>CHOU CHOU</h2><a href="dashboard.html">ダッシュボード</a><a href="cast.html">キャスト管理</a><a href="schedule.html">出勤管理</a><a href="sales.html">売上管理</a><a href="news.html">お知らせ</a><a class="active" href="event.html">イベント</a><a href="gallery.html">ギャラリー</a><a href="system.html">料金・メニュー</a><a href="recruit.html">求人管理</a><a href="settings.html">サイト設定</a><a href="login.html">ログアウト</a></aside>
    <main class="main">
      <header class="admin-page-head"><div><h1>イベント管理</h1><p>画像・掲載期間・リンクをホームページへリアルタイム反映します。</p></div></header>
      <section class="admin-editor-panel admin-editor-padding">
        <form id="eventAdminForm" class="admin-form-grid">
          <label class="admin-field"><span>タイトル</span><input name="title" maxlength="100" required></label>
          <label class="admin-field"><span>リンク</span><input name="linkUrl" type="url" maxlength="500" placeholder="https://..."></label>
          <label class="admin-field is-wide"><span>説明</span><textarea name="description" maxlength="1000"></textarea></label>
          <label class="admin-field"><span>掲載開始</span><input name="publishStart" type="datetime-local"></label>
          <label class="admin-field"><span>掲載終了</span><input name="publishEnd" type="datetime-local"></label>
          <label class="admin-field is-wide"><span>イベント画像</span><input name="image" type="file" accept="image/*" data-preview-target="eventImagePreview"><img id="eventImagePreview" class="admin-image-preview" alt="イベント画像プレビュー" hidden></label>
          <label class="admin-switch"><input name="isPublished" type="checkbox" checked>公開する</label>
          <div class="admin-inline-actions is-wide"><button class="admin-primary-button" type="submit">保存する</button><button id="resetEvent" type="button">入力をリセット</button></div>
        </form>
        <p id="eventMessage" class="admin-status" aria-live="polite"></p>
      </section>
      <div id="eventList" class="admin-list-grid"></div>
    </main>
  </div>
  <script type="module" src="../assets/event-manager.js?v=7.5.0"></script>
</body>
</html>

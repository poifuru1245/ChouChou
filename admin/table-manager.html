<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>席管理 | Chou Chou</title><link rel="stylesheet" href="../assets/css/operations.css?v=3.0.0"></head>
<body class="admin-premium"><div class="admin-layout"><aside class="sidebar"><h2>CHOU CHOU</h2><a href="dashboard.html">ダッシュボード</a><a href="reservations.html">予約管理</a><a href="customers.html">顧客管理</a><a class="active" href="table-manager.html">席管理</a><a href="visit-history.html">来店履歴</a><a href="login.html">ログアウト</a></aside>
<main class="main operations-page"><header class="operations-head"><div><span>FLOOR CONTROL</span><h1>席管理</h1><p>空席・予約・着席・清掃状況をリアルタイムで管理します。</p></div><div class="operations-actions"><button id="openTableEditor" class="is-primary" type="button">＋ 席を登録</button></div></header>
<section class="operations-summary"><article class="operations-card"><span>ALL TABLES</span><strong id="tableTotal">0</strong><small>全席</small></article><article class="operations-card"><span>AVAILABLE</span><strong id="tableVacant">0</strong><small>空席</small></article><article class="operations-card"><span>IN USE</span><strong id="tableInUse">0</strong><small>使用中</small></article><article class="operations-card"><span>RESERVED</span><strong id="tableReserved">0</strong><small>予約済</small></article></section>
<section class="operations-panel"><div class="operations-panel-head"><div><span>REALTIME FLOOR</span><h2>フロア状況</h2></div><label class="admin-field"><span>席タイプ</span><select id="tableTypeFilter"><option value="">すべて</option><option>ボックス</option><option>VIP</option><option>カウンター</option></select></label></div><div id="tableGrid" class="table-grid" aria-live="polite"><p class="operations-empty">席情報を読み込み中...</p></div></section><p id="tableMessage" class="admin-status" aria-live="polite"></p></main></div>
<div id="tableEditorModal" class="operations-modal" role="dialog" aria-modal="true" hidden><div class="operations-modal-card operations-card"><button class="operations-modal-close" type="button" data-close-table aria-label="閉じる">×</button><span>TABLE EDITOR</span><h2 id="tableEditorTitle">席を登録</h2><form id="tableForm" class="operations-form"><label class="admin-field"><span>席名 *</span><input name="name" maxlength="80" required></label><label class="admin-field"><span>タイプ</span><select name="type"><option>ボックス</option><option>VIP</option><option>カウンター</option></select></label><label class="admin-field"><span>定員</span><input name="capacity" type="number" min="1" max="99" value="4" required></label><label class="admin-field"><span>並び順</span><input name="displayOrder" type="number" min="0" value="0"></label><label class="admin-field"><span>状態</span><select name="status"><option>空席</option><option>使用中</option><option>清掃中</option><option>予約済</option></select></label><label class="admin-field is-wide"><span>メモ</span><textarea name="memo" maxlength="500"></textarea></label><div class="operations-actions is-wide"><button class="is-primary" type="submit">保存</button><button type="button" data-close-table>キャンセル</button></div></form></div></div>
<div id="tableMoveModal" class="operations-modal" role="dialog" aria-modal="true" hidden><div class="operations-modal-card operations-card"><button class="operations-modal-close" type="button" data-close-move aria-label="閉じる">×</button><span>TABLE TRANSFER</span><h2>席を移動</h2><form id="tableMoveForm" class="operations-form"><label class="admin-field is-wide"><span>移動先</span><select name="targetTableId" required></select></label><div class="operations-actions is-wide"><button class="is-primary" type="submit">席移動を確定</button><button type="button" data-close-move>キャンセル</button></div></form></div></div>
<script type="module" src="../assets/table-manager.js?v=3.0.0"></script></body></html>

<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人管理 | Chou Chou</title><link rel="stylesheet" href="../assets/css/admin.css?v=6.3.0"></head>
<body class="admin-premium"><div class="admin-layout"><aside class="sidebar"><h2>CHOU CHOU</h2><a href="dashboard.html">ダッシュボード</a><a href="cast.html">キャスト管理</a><a href="schedule.html">出勤管理</a><a href="news.html">お知らせ</a><a href="gallery.html">ギャラリー</a><a href="system.html">料金・メニュー</a><a class="active" href="recruit.html">求人管理</a><a href="settings.html">サイト設定</a><a href="login.html">ログアウト</a></aside>
<main class="main"><header class="admin-page-head"><div><h1>求人管理</h1><p>募集内容・メイン画像・応募LINEをホームページへリアルタイム反映します。</p></div></header>
<section class="admin-editor-panel admin-editor-padding"><form id="recruitAdminForm" class="admin-form-grid"><label class="admin-field"><span>見出し</span><input name="title" maxlength="80" required></label><label class="admin-field"><span>応募LINE URL</span><input name="applicationLineUrl" type="url" placeholder="https://line.me/..."></label><label class="admin-field is-wide"><span>キャッチコピー</span><input name="lead" maxlength="160"></label><label class="admin-field is-wide"><span>募集内容</span><textarea name="description" maxlength="1200"></textarea></label><label class="admin-field is-wide"><span>待遇（1行に1項目）</span><textarea name="benefits" placeholder="未経験歓迎&#10;体験入店OK&#10;日払いOK"></textarea></label><label class="admin-field is-wide"><span>求人画像</span><input id="recruitImage" name="image" type="file" accept="image/*" data-preview-target="recruitImagePreview"><img id="recruitImagePreview" class="admin-image-preview" alt="求人画像プレビュー" hidden></label><label class="admin-switch"><input name="isPublished" type="checkbox" checked>求人を公開する</label><div class="admin-inline-actions is-wide"><button class="admin-primary-button" type="submit">求人情報を保存</button></div></form><p id="recruitMessage" class="admin-status" aria-live="polite"></p></section></main></div><script type="module" src="../assets/recruit-manager.js?v=6.3.0"></script></body></html>

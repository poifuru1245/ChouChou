<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>売上分析 | Chou Chou</title><link rel="stylesheet" href="../assets/css/analytics.css?v=5.0.0"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script></head>
<body class="admin-premium"><div class="admin-layout"><aside class="sidebar"><h2>CHOU CHOU</h2><a href="dashboard.html">ダッシュボード</a><a class="active" href="analytics-dashboard.html">経営分析</a><a href="notifications.html">通知センター</a><a href="sales.html">売上管理</a><a href="login.html">ログアウト</a></aside><main class="main analytics-page"><header class="analytics-header"><div><span class="analytics-eyebrow">SALES INTELLIGENCE</span><h1>売上分析</h1><p>期間・時間・曜日・キャスト・指名・商品・決済方法から売上を分析します。</p></div><nav class="analytics-nav" aria-label="分析メニュー"><a href="analytics-dashboard.html">KPI</a><a aria-current="page" href="analytics-sales.html">売上</a><a href="analytics-cast.html">キャスト</a><a href="analytics-customers.html">顧客</a></nav></header>
<section class="analytics-panel"><div class="analytics-panel-head"><div><span>FILTER</span><h2>分析条件</h2></div><div class="analytics-toolbar" id="salesPeriodToolbar"><button type="button" data-period="today">今日</button><button type="button" data-period="week">今週</button><button class="is-active" type="button" data-period="month">今月</button><button type="button" data-period="year">今年</button><select id="salesDimension" aria-label="集計軸"><option value="day">日別</option><option value="week">週別</option><option value="month">月別</option><option value="year">年別</option><option value="hour">時間帯別</option><option value="weekday">曜日別</option><option value="cast">キャスト別</option><option value="nomination">指名別</option><option value="champagne">シャンパン別</option><option value="bottle">ボトル別</option></select></div></div><div class="analytics-chart"><canvas id="salesAnalysisChart" aria-label="売上分析グラフ"></canvas></div></section>
<div class="analytics-grid"><section class="analytics-panel"><div class="analytics-panel-head"><div><span>PAYMENTS</span><h2>決済方法別</h2></div></div><div class="analytics-chart is-compact"><canvas id="salesPaymentChart" aria-label="決済方法別売上"></canvas></div></section><section class="analytics-panel"><div class="analytics-panel-head"><div><span>BREAKDOWN</span><h2>集計一覧</h2></div></div><div id="salesAnalysisTable" class="analytics-table-wrap"></div></section><section class="analytics-panel"><div class="analytics-panel-head"><div><span>CHARGE MIX</span><h2>料金・商品別売上</h2></div></div><div id="salesChargeBreakdown" class="analytics-table-wrap"></div></section><section class="analytics-panel"><div class="analytics-panel-head"><div><span>RANKING</span><h2>キャスト売上ランキング</h2></div></div><ol id="salesRanking" class="analytics-ranking"></ol></section><section class="analytics-panel is-wide"><div class="analytics-panel-head"><div><span>HEATMAP</span><h2>曜日 × 時間帯</h2></div></div><div id="salesHeatmap" class="analytics-heatmap"></div></section></div><p id="salesAnalyticsMessage" class="analytics-status" aria-live="polite">データを読み込んでいます。</p></main></div><script type="module" src="../assets/admin.js?v=8.2.1"></script><script type="module" src="../assets/analytics-sales.js?v=5.1.0"></script></body></html>

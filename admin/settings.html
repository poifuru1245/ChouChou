<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>サイト設定</title>

<link rel="stylesheet" href="../assets/css/admin.css?v=7.2.0">

</head>

<body class="admin-premium">

<div class="admin-layout">

<aside class="sidebar">
<h2>Chou Chou</h2>
<a href="dashboard.html">ダッシュボード</a>
<a href="cast.html">キャスト管理</a>
<a href="schedule.html">出勤管理</a>
<a href="news.html">お知らせ</a>
<a href="gallery.html">ギャラリー</a>
<a href="system.html">料金・メニュー</a>
<a href="recruit.html">求人管理</a>
<a href="settings.html" class="active">サイト設定</a>
<a href="login.html">ログアウト</a>
</aside>

<main class="main">

<h1>サイト設定</h1>

<form id="siteSettingsForm" class="settings-form">

<div class="settings-grid">
<label class="settings-field-wide">
<span>トップ画像 URL</span>
<input type="text" name="heroImageUrl" placeholder="assets/img/hero/top-ver62.jpg または https://...">
</label>

<label>
<span>WEB予約 URL</span>
<input type="text" name="webReservationUrl" placeholder="reservation.html">
</label>

<label>
<span>LINE予約 URL</span>
<input type="text" name="lineReservationUrl" placeholder="https://line.me/...">
</label>

<label>
<span>求人募集 URL</span>
<input type="text" name="recruitUrl" placeholder="recruit.html">
</label>

<label>
<span>応募通知用LINE URL</span>
<input type="text" name="recruitNotifyLineUrl" placeholder="https://line.me/...">
</label>

<label>
<span>応募通知用メールアドレス</span>
<input type="email" name="recruitNotifyEmail" placeholder="recruit@example.com">
</label>

<label>
<span>電話番号</span>
<input type="tel" name="phoneNumber" placeholder="011-000-0000">
</label>

<label>
<span>お問い合わせフォーム URL</span>
<input type="text" name="contactFormUrl" placeholder="contact.html">
</label>

<label>
<span>Instagram URL</span>
<input type="text" name="instagramUrl" placeholder="https://www.instagram.com/...">
</label>

<label class="settings-toggle-field">
<input type="checkbox" name="instagramSectionEnabled" checked>
<span>トップページにInstagram最新投稿を表示する</span>
</label>

<label>
<span>X URL</span>
<input type="text" name="xUrl" placeholder="https://x.com/...">
</label>

<label class="settings-field-wide">
<span>Google Map URL</span>
<input type="text" name="googleMapUrl" placeholder="Google Mapの共有URLまたは住所">
</label>

<label>
<span>営業時間</span>
<input type="text" name="businessHours" placeholder="19:00〜LAST">
</label>

<label>
<span>定休日</span>
<input type="text" name="closedDay" placeholder="日曜">
</label>
</div>

<section class="v72-admin-event-panel admin-premium-card" aria-labelledby="eventSettingsTitle">
<div class="admin-page-head"><div><span>EVENT BANNER</span><h2 id="eventSettingsTitle">トップページ イベントバナー</h2></div></div>
<div class="settings-grid">
<label class="settings-toggle-field settings-field-wide">
<input type="checkbox" name="eventBannerEnabled">
<span>イベントバナーを公開する</span>
</label>
<label class="settings-field-wide">
<span>タイトル</span>
<input type="text" name="eventBannerTitle" maxlength="80" placeholder="今月のスペシャルイベント">
</label>
<label>
<span>リンク</span>
<input type="text" name="eventBannerLink" placeholder="news.html または https://...">
</label>
<label>
<span>画像URL</span>
<input type="text" name="eventBannerImageUrl" placeholder="https://...">
</label>
<label class="settings-field-wide">
<span>バナー画像をアップロード</span>
<input type="file" id="eventBannerImageFile" accept="image/*" data-preview-target="eventBannerImagePreview">
<img id="eventBannerImagePreview" class="admin-image-preview v72-event-image-preview" alt="イベントバナープレビュー" hidden>
</label>
<label>
<span>掲載開始日</span>
<input type="date" name="eventBannerStartDate">
</label>
<label>
<span>掲載終了日</span>
<input type="date" name="eventBannerEndDate">
</label>
</div>
</section>

<div class="settings-actions">
<button type="submit" class="settings-save-btn">保存する</button>
<p id="siteSettingsStatus" class="settings-status" aria-live="polite"></p>
</div>

</form>

</main>

</div>

<script type="module" src="../assets/admin.js?v=6.3.0"></script>
<script type="module" src="../assets/settings-manager.js?v=7.2.0"></script>

</body>

</html>

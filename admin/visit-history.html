<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>来店履歴 | Chou Chou</title><link rel="stylesheet" href="../assets/css/operations.css?v=3.0.0"></head>
<body class="admin-premium"><div class="admin-layout"><aside class="sidebar"><h2>CHOU CHOU</h2><a href="dashboard.html">ダッシュボード</a><a href="reservations.html">予約管理</a><a href="customers.html">顧客管理</a><a href="table-manager.html">席管理</a><a class="active" href="visit-history.html">来店履歴</a><a href="login.html">ログアウト</a></aside>
<main class="main operations-page"><header class="operations-head"><div><span>GUEST JOURNEY</span><h1>来店履歴</h1><p>予約から受付・着席・延長・会計までの履歴を確認します。</p></div><div class="operations-actions"><a href="reservations.html">予約管理</a><a href="table-manager.html">席管理</a></div></header>
<section class="operations-summary"><article class="operations-card"><span>TODAY VISITS</span><strong id="visitToday">0</strong><small>本日の来店</small></article><article class="operations-card"><span>SEATED</span><strong id="visitSeated">0</strong><small>着席中</small></article><article class="operations-card"><span>EXTENSION</span><strong id="visitExtended">0</strong><small>延長</small></article><article class="operations-card"><span>COMPLETED</span><strong id="visitCompleted">0</strong><small>本日完了</small></article></section>
<section class="operations-panel"><div class="operations-panel-head"><div><span>VISIT LEDGER</span><h2>履歴一覧</h2></div><strong id="visitResultCount">0件</strong></div><div class="operations-filters"><label class="admin-field"><span>開始日</span><input id="visitDateFrom" type="date"></label><label class="admin-field"><span>終了日</span><input id="visitDateTo" type="date"></label><label class="admin-field"><span>状態</span><select id="visitStatus"><option value="">すべて</option><option>予約</option><option>受付</option><option>着席</option><option>延長</option><option>会計</option><option>完了</option><option>キャンセル</option><option>無断キャンセル</option></select></label><label class="admin-field"><span>検索</span><input id="visitSearch" type="search" placeholder="お客様・席・キャスト"></label></div><div id="visitList" class="operations-table-wrap" aria-live="polite"><p class="operations-empty">来店履歴を読み込み中...</p></div></section><p id="visitMessage" class="admin-status" aria-live="polite"></p></main></div>
<script type="module" src="../assets/visit-history.js?v=3.0.0"></script></body></html>
